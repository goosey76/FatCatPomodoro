name: FatCatPomodoro
options:
  bundleIdPrefix: com.fatcat
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "NZJ6XP9B66"

targets:
  FatCatPomodoro:
    type: application
    platform: macOS
    sources:
      - path: Sources/FatCatPomodoro
        excludes:
          - Info.plist
          - "**/.DS_Store"
    resources:
      - path: Sources/FatCatPomodoro/Resources
      - path: Sources/FatCatPomodoro/Assets.xcassets
    info:
      path: Sources/FatCatPomodoro/Info.plist
      properties:
        CFBundleIconName: AppIcon
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsUsageDescription: "FatCatPomodoro reads your upcoming Calendar events to show what's next during focus sessions and breaks."
        NSRemindersUsageDescription: "FatCatPomodoro reads your Reminders to show your next task during focus sessions and breaks."
    entitlements:
      path: Sources/FatCatPomodoro/FatCatPomodoro.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatcat.FatCatPomodoro
        PRODUCT_NAME: FatCatPomodoro
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/FatCatPomodoro/FatCatPomodoro.entitlements
        INFOPLIST_FILE: Sources/FatCatPomodoro/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
